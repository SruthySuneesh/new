<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Buttons Example</title>
    <style>
        /* Centers the button container on the screen */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center; 
            align-items: center;    
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        /* Keeps the two main buttons side by side with a gap */
        .button-group {
            display: flex;
            gap: 20px;
        }

        /* Styling for the buttons to make them look nice */
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: white;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        /* The Form Overlay (hidden by default) */
        .form-overlay {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Dimmed background */
            justify-content: center;
            align-items: center;
        }

        /* The Form Container Box */
        .form-container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-container input {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    
    <div class="button-group">
        <button id="consoleBtn">Click Here!</button>
        <button id="formBtn">Open Name Form</button>
    </div>

    <div id="formOverlay" class="form-overlay">
        <form id="nameForm" class="form-container">
            <label for="userName"><strong>Enter your name:</strong></label>
            <input type="text" id="userName" required placeholder="Your name here...">
            <button type="submit" style="background-color: #4CAF50; color: white; border: none;">Submit</button>
        </form>
    </div>

    <script>
        // Get elements from the DOM
        const consoleBtn = document.getElementById('consoleBtn');
        const formBtn = document.getElementById('formBtn');
        const formOverlay = document.getElementById('formOverlay');
        const nameForm = document.getElementById('nameForm');
        const nameInput = document.getElementById('userName');

        // 1. First Button: Just logs to the console
        consoleBtn.addEventListener('click', () => {
            console.log('Button was clicked!');
        });

        // 2. Second Button: Opens the form overlay
        formBtn.addEventListener('click', () => {
            formOverlay.style.display = 'flex';
        });

        // 3. Form Submission: Logs the name and hides the form
        nameForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const enteredName = nameInput.value;
            console.log('Submitted Name:', enteredName); // Logs the entered name

            nameForm.reset(); // Clears the input field
            formOverlay.style.display = 'none'; // Hides the form again
        });
    </script>
</body>
</html>
